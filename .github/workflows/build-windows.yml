
name: Build MediaHub Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WinFsp SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $installer
          $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $installer + '"'), '/qn', '/norestart', 'INSTALLLEVEL=1000') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "WinFsp installation failed: $($install.ExitCode)" }
          $assembly = Join-Path ${env:ProgramFiles(x86)} 'WinFsp/bin/winfsp-msil.dll'
          if (-not (Test-Path -LiteralPath $assembly)) { throw "WinFsp .NET assembly missing: $assembly" }

      - name: Restore
        run: dotnet restore src/MediaHub/MediaHub.csproj

      - name: Clear previous artifacts
        shell: pwsh
        run: |
          $output = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'artifacts'))
          $expected = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\artifacts'
          if ($output -ne $expected) { throw 'Unexpected artifacts path.' }
          if (Test-Path -LiteralPath $output) {
            Remove-Item -LiteralPath $output -Recurse -Force
          }

      - name: Prepare portable download tools
        shell: pwsh
        run: ./scripts/prepare-download-tools.ps1

      - name: Publish Windows EXE
        run: >
          dotnet publish src/MediaHub/MediaHub.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/publish/README.txt
          Compress-Archive -Path artifacts/publish/* -DestinationPath MediaHub-win-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaHub-win-x64
          path: MediaHub-win-x64.zip
